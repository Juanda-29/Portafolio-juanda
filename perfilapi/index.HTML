<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>

    <title>Perfil Usuario</title>
</head>

<body>

<div class="card">

    <img id="perfil" alt="Foto de Perfil">

    <h1>Perfil de Usuario</h1>


    <h2>Información Personal</h2>

    <table>
        <tr>
            <td>Nombre</td>
            <td id="nombre"></td>
        </tr>

        <tr>
            <td>Usuario</td>
            <td id="usuario"></td>
        </tr>

        <tr>
            <td>Género</td>
            <td id="genero"></td>
        </tr>

        <tr>
            <td>Edad</td>
            <td id="edad"></td>
        </tr>

        <tr>
            <td>Fecha nacimiento</td>
            <td id="nacimiento"></td>
        </tr>
    </table>



    <h2>Información de Contacto</h2>

    <table>

        <tr>
            <td>Email</td>
            <td id="email"></td>
        </tr>

        <tr>
            <td>Teléfono</td>
            <td id="telefono"></td>
        </tr>

        <tr>
            <td>Celular</td>
            <td id="celular"></td>
        </tr>

    </table>



    <h2>Ubicación</h2>

    <table>

        <tr>
            <td>País</td>
            <td id="pais"></td>
        </tr>

        <tr>
            <td>Estado</td>
            <td id="estado"></td>
        </tr>

        <tr>
            <td>Ciudad</td>
            <td id="ciudad"></td>
        </tr>

        <tr>
            <td>Dirección</td>
            <td id="direccion"></td>
        </tr>

        <tr>
            <td>Código Postal</td>
            <td id="codigo"></td>
        </tr>

    </table>



    <h2>Información Adicional</h2>

    <table>

        <tr>
            <td>Nacionalidad</td>
            <td id="nacionalidad"></td>
        </tr>

        <tr>
            <td>Latitud</td>
            <td id="latitud"></td>
        </tr>

        <tr>
            <td>Longitud</td>
            <td id="longitud"></td>
        </tr>

        <tr>
            <td>Zona Horaria</td>
            <td id="zona"></td>
        </tr>

    </table>


</div>



<script>

document.addEventListener("DOMContentLoaded", async()=>{

    try{

        let respuesta = await axios.get("https://randomuser.me/api/");

        let datos = respuesta.data.results[0];


        document.getElementById("perfil").src = datos.picture.large;


        document.getElementById("nombre").textContent =
        datos.name.first + " " + datos.name.last;


        document.getElementById("usuario").textContent =
        "@" + datos.login.username;


        document.getElementById("genero").textContent =
        datos.gender;


        document.getElementById("edad").textContent =
        datos.dob.age + " años";


        document.getElementById("nacimiento").textContent =
        datos.dob.date.substring(0,10);



        document.getElementById("email").textContent =
        datos.email;


        document.getElementById("telefono").textContent =
        datos.phone;


        document.getElementById("celular").textContent =
        datos.cell;



        document.getElementById("pais").textContent =
        datos.location.country;


        document.getElementById("estado").textContent =
        datos.location.state;


        document.getElementById("ciudad").textContent =
        datos.location.city;


        document.getElementById("direccion").textContent =
        datos.location.street.number + " " +
        datos.location.street.name;


        document.getElementById("codigo").textContent =
        datos.location.postcode;



        document.getElementById("nacionalidad").textContent =
        datos.nat;


        document.getElementById("latitud").textContent =
        datos.location.coordinates.latitude;


        document.getElementById("longitud").textContent =
        datos.location.coordinates.longitude;


        document.getElementById("zona").textContent =
        datos.location.timezone.description;


    }catch(error){

        console.log("Error cargando datos:", error);

    }

});


</script>
<style>
   
*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    background:linear-gradient(135deg,#74ebd5,#9face6);

    min-height:100vh;

    margin:0;

    padding:30px;

}




.card{

    width:100%;

    max-width:1400px;

    margin:auto;

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:0 15px 35px rgba(0,0,0,0.18);

}




#perfil{

    width:150px;

    height:150px;

    object-fit:cover;

    border-radius:50%;

    display:block;

    margin:auto;

    border:5px solid #00b894;

    box-shadow:0 5px 15px rgba(0,0,0,0.20);

}




h1{

    text-align:center;

    color:#2d3436;

    font-size:30px;

    margin:20px 0 30px;

}




h2{

    background:linear-gradient(90deg,#0984e3,#00cec9);

    color:white;

    padding:10px;

    border-radius:10px;

    font-size:18px;

    margin-top:25px;

    text-align:center;

}




table{

    width:100%;

    border-collapse:collapse;

    margin-top:12px;

    background:white;

    border-radius:10px;

    overflow:hidden;

}




td{

    padding:10px;

    border:1px solid #ddd;

    font-size:14px;

}




td:first-child,
td:nth-child(3){

    width:18%;

    font-weight:bold;

    color:#0984e3;

    background:#eef7ff;

}




td:nth-child(2),
td:nth-child(4){

    width:32%;

    background:#ffffff;

    color:#333;

}




tr:hover td{

    background:#f0fffb;

}




table + h2{

    margin-top:30px;

}




@media(max-width:800px){

    body{

        padding:15px;

    }


    .card{

        padding:20px;

    }


    #perfil{

        width:120px;

        height:120px;

    }


    td{

        font-size:13px;

        padding:8px;

    }

}
</style>


</body>
</html>
